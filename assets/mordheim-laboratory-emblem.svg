  <g fill="#dfbc80"><circle cx="51.7" cy="77.7" r="1.6"/><circle cx="57.5" cy="81.5" r="1.6"/><circle cx="63.3" cy="85.3" r="1.6"/></g>
  <path d="m23 53 2-3 2 3-2 3-2-3Zm62 0 2-3 2 3-2 3-2-3Z" fill="#c49b63"/>
