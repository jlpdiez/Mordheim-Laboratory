<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 120" fill="none">
  <title>Mordheim Laboratory · Sello del dado y el cometa</title>
  <defs>
    <linearGradient id="brass" x1="18" y1="8" x2="91" y2="109" gradientUnits="userSpaceOnUse"><stop stop-color="#f1dab0"/><stop offset=".46" stop-color="#c69b5e"/><stop offset="1" stop-color="#89613a"/></linearGradient>
    <linearGradient id="glass" x1="40" y1="55" x2="75" y2="99" gradientUnits="userSpaceOnUse"><stop stop-color="#d8b16b" stop-opacity=".14"/><stop offset="1" stop-color="#d8b16b" stop-opacity=".02"/></linearGradient>
  </defs>
  <!-- Broken astrolabe ring, engraved rather than a conventional shield. -->
